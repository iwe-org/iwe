name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Check formatting
      if: runner.os == 'Linux'
      run: cargo fmt --check
    - name: Lint
      if: runner.os == 'Linux'
      run: cargo clippy --workspace --all-targets --all-features
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose --no-fail-fast

  musl:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install musl toolchain
      uses: taiki-e/setup-cross-toolchain-action@v1
      with:
        target: x86_64-unknown-linux-musl
    - name: Build
      run: cargo build --release --target x86_64-unknown-linux-musl --bin iwe --bin iwes --bin iwec
    - name: Check binaries are static
      run: |
        for bin in iwe iwes iwec; do
          file "target/x86_64-unknown-linux-musl/release/$bin" | grep -q 'static' || { file "target/x86_64-unknown-linux-musl/release/$bin"; exit 1; }
        done
    - name: Run on Alpine
      run: |
        docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release:/opt/iwe:ro" alpine:3 \
          sh -c '/opt/iwe/iwe --version && /opt/iwe/iwec --version'
