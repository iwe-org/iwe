[package]
name = "iwes"
description = "IWE language server: Markdown knowledge base navigation, completion and refactoring in any LSP editor"
homepage = "https://iwe.md/docs/editors/"
documentation = "https://iwe.md/docs/"
include = ["Cargo.toml", "src/**/*.rs", "tests/**/*.rs", "tests/**/*.md"]
autotests = false

version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "iwes"
path = "src/main.rs"

[dependencies]
liwe.workspace = true
diwe.workspace = true
indoc.workspace = true
clap.workspace = true
itertools.workspace = true
log.workspace = true
fuzzy-matcher.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
extend.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
relative-path.workspace = true
once_cell.workspace = true
minijinja.workspace = true
uuid.workspace = true
chrono.workspace = true
sys-locale.workspace = true
sanitize-filename.workspace = true
url.workspace = true
percent-encoding.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[dev-dependencies]
assert-json-diff.workspace = true
difference.workspace = true
tempfile.workspace = true

[lints]
workspace = true
